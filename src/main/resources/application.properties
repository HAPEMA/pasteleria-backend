spring.application.name=pasteleria-backend

# Base de datos (sidecar MySQL en el mismo Task de ECS, igual patron que EP3)
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pasteleria_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:pasteleria_user}
spring.datasource.password=${DB_PASSWORD:pasteleria_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8083

# Actuator: requerido para los health checks del ALB / Target Group.
# Leccion aprendida en EP3: sin esto el ALB marca el target como unhealthy.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# NOTA: a proposito NO se define SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
# aqui ni en el task definition, porque en EP3 esa variable con valor -1 rompia
# el arranque de Spring Boot en ECS.
